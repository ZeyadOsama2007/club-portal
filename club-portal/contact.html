<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل معنا | نادي التكنولوجيا</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<header id="top"></header>
<main>
<h1>📞 تواصل معنا</h1>
<form id="contactForm" novalidate>
<label>الاسم</label><input name="name" type="text"><span class="error"></span>
<label>البريد الإلكتروني</label><input name="email" type="email"><span class="error"></span>
<label>الرسالة</label><textarea name="message" rows="4"></textarea><span class="error"></span>
<br><button class="btn" type="submit">إرسال</button>
</form>
<p class="success" id="success">✅ تم إرسال رسالتك بنجاح!</p>
</main>
<footer id="foot"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
