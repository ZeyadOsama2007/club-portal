<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التسجيل | نادي التكنولوجيا</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<header id="top"></header>
<main>
<h1>📝 التسجيل في فعالية</h1>
<form id="regForm" novalidate>
<label>الاسم الكامل</label><input name="name" type="text"><span class="error"></span>
<label>البريد الإلكتروني</label><input name="email" type="email"><span class="error"></span>
<label>رقم الموبايل</label><input name="phone" type="tel" placeholder="01XXXXXXXXX"><span class="error"></span>
<label>الفعالية</label><select name="event" id="event"></select><span class="error"></span>
<br><button class="btn" type="submit">تسجيل</button>
</form>
<p class="success" id="success">✅ تم التسجيل بنجاح! هنتواصل معاك قريباً.</p>
</main>
<footer id="foot"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
